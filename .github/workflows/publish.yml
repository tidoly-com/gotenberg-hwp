name: publish

# Builds on native runners per architecture, smoke-tests each, then pushes one
# multi-arch tag. Tags are never overwritten: nodes pull IfNotPresent.
on:
  push:
    branches: [main]
    paths: [Dockerfile, build/**, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          img=$(build/tag.sh)
          echo "image=$img" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$img already published — skipping (bump a version in Dockerfile to publish)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.exists == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ needs.tag.outputs.image }}

      - name: Smoke test
        run: build/smoke.sh "${{ needs.tag.outputs.image }}"

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
          echo "${{ matrix.platform }} $d"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tag
        working-directory: /tmp/digests
        run: |
          img="${{ needs.tag.outputs.image }}"
          repo="${img%:*}"
          # re-check right before writing: never overwrite an existing tag
          if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
            echo "::error::$img appeared while building — refusing to overwrite"; exit 1
          fi
          docker buildx imagetools create -t "$img" $(printf "$repo@sha256:%s " *)
      - name: Registry read-back
        run: |
          out=$(docker buildx imagetools inspect "${{ needs.tag.outputs.image }}")
          echo "$out"
          grep -q 'linux/amd64' <<<"$out"
          grep -q 'linux/arm64' <<<"$out"
